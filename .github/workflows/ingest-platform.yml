name: Ingestion Platform

# The modular pipeline (apps/ingest). Runs alongside the legacy orchestrator in
# ingest-jobs.yml rather than replacing it — the legacy run still owns Tier 1 and
# Tier 3, and nothing is cut over until a full-tier parity run is clean.
#
# Three jobs, deliberately separate:
#
#   workday  a source the legacy orchestrator has no adapter for, so this is the
#            only way its listings reach the feed.
#   sweep    the time-based expiry backstop. Per-slug reconciliation only runs
#            after a *successful fetch of that slug*, so a source that stops
#            running entirely reconciles nothing and its listings stay Active
#            forever with no alarm. That is not hypothetical: 22 listings for a
#            board removed from the registry sat live and unconfirmed for 23 days
#            before this sweep found them.

on:
  schedule:
    # 05:00 UTC (10:30 IST) — after Tier 1 (00:00) and Tier 3 (04:00), so the
    # three ingests never contend on the database.
    - cron: "0 5 * * *"
    # 06:00 UTC — the sweep runs last, once every source has had its chance to
    # refresh lastSeenAt. Running it earlier would judge listings on stale data.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (workday | aggregators | sweep | both)"
        required: false
        default: "both"

concurrency:
  group: ingest-platform-${{ github.event.schedule || github.event.inputs.job || 'all' }}
  cancel-in-progress: true

jobs:
  workday:
    # Only on the 05:00 cron, or when dispatched for it.
    if: github.event.schedule == '0 5 * * *' || github.event.inputs.job == 'workday' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Test
        run: npm test
      - name: Ingest Workday
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # --write is required; the runner defaults to a dry run precisely so a
        # misconfigured job cannot quietly mutate the live feed.
        run: npm run ingest:next -- --source=workday --write

  # Google-for-Jobs aggregators. These exist for description quality rather than
  # volume: they return the full posting (median ~950–1,950 characters against
  # ~500 across the rest of the collection), which is what requirement
  # extraction and résumé matching read. Roughly 30–50 jobs a day.
  #
  # Both are quota-bound on free plans — SerpAPI 250 searches/month, JSearch 200
  # requests/month. At the registered shard counts a daily run spends about 90
  # and 60 respectively, which fits with headroom. Each connector also enforces
  # its own hard per-run cap, so a registry change cannot silently burn a month.
  aggregators:
    if: github.event.schedule == '0 5 * * *' || github.event.inputs.job == 'aggregators' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Ingest SerpAPI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run ingest:next -- --source=serpapi --write
      - name: Ingest JSearch
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        # Runs even if SerpAPI failed — one quota-exhausted source must not
        # take the other down with it.
        if: always()
        run: npm run ingest:next -- --source=jsearch --write
      - name: Ingest Unstop
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # No API key: Unstop's opportunity search is a public, unauthenticated
        # endpoint that its own robots.txt allows (`Allow: /api/public/*`), so
        # unlike the two above it carries no quota and cannot be exhausted.
        #
        # Measured pre-flight over 180 live postings: 99% clear the 600-character
        # indexing bar and 84% are both fresher-eligible and indexable, against
        # 0% for Adzuna, which supplies 70% of the collection and yields nothing
        # publishable. The internships stream returns source-stated experience on
        # every posting.
        if: always()
        run: npm run ingest:next -- --source=unstop --write

  sweep:
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.job == 'sweep' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Freshness sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Closes listings unconfirmed for longer than the expiry threshold (45
        # days). With every source healthy this closes nothing — it is a safety
        # net that only acts when something upstream has actually broken, and it
        # prints a [HEALTH ALERT] naming any source that has gone quiet.
        run: npm run ingest:next -- --sweep --write
