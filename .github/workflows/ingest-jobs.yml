name: Staggered Job Ingestion

on:
  schedule:
    # Staggered so each tier only spends its own API quota and the tiers never
    # overlap. Tier is routed from whichever schedule fired (see "Determine
    # tier" below). Times are UTC.
    - cron: "0 0 * * *" # 00:00 UTC (05:30 IST) — Tier 1: Adzuna aggregator APIs
    - cron: "0 4 * * *" # 04:00 UTC (09:30 IST) — Tier 3: company ATS boards
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (1 = Adzuna/Jooble, 3 = ATS; blank = every source)"
        required: false
        default: ""
        # Tier 5 (Careerjet) is deliberately absent and currently dormant: it
        # authenticates by declared static IP, which no GitHub-hosted runner can
        # satisfy. Leaving `tier` blank here runs every source, which means
        # Careerjet will 403 — harmless, since failures are isolated per
        # company, but expect it in the log.

concurrency:
  # One group per tier (keyed by the cron that fired, or the dispatch input), so
  # a Tier 1 run and a Tier 3 run never cancel each other. Within a tier, a new
  # run cancels an in-flight one.
  group: ingest-${{ github.event.schedule || github.event.inputs.tier || 'all' }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test scam filter
        run: npm test

      - name: Determine tier
        id: tier
        # Map the firing schedule to a tier. On workflow_dispatch, honor the
        # input (blank = every source). The ingest script treats an empty
        # INGEST_TIER as "run all", so a blank value is a safe default.
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *") tier=1 ;;
            "0 4 * * *") tier=3 ;;
            *) tier="${{ github.event.inputs.tier }}" ;;
          esac
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "Running ingest tier: ${tier:-all}"

      - name: Run ingestion pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Adzuna aggregator (Tier 1). Add these as repo secrets (Settings >
          # Secrets and variables > Actions). If absent, only Tier 1 fails; the
          # ATS tier still ingests.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Jooble aggregator (Tier 1). Free key with a 500-request default
          # quota; the adapter caps itself at JOOBLE_MAX_REQUESTS per run.
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          # Careerjet aggregator (Tier 1). India-native, with a structured
          # contract_type=i internship filter rather than keyword guessing.
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          INGEST_TIER: ${{ steps.tier.outputs.tier }}
        run: npm run ingest
