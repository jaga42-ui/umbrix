name: Nightly Job Ingestion

on:
  schedule:
    # 00:00 UTC = 5:30 AM IST — the feed is fresh before students wake up
    - cron: "0 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-jobs
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test scam filter
        run: npm test

      - name: Run ingestion pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Adzuna aggregator (all-field India fresher inventory). Add these as
          # repo secrets (Settings > Secrets and variables > Actions). If absent,
          # only the Adzuna shards fail; ATS sources still ingest.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run ingest
